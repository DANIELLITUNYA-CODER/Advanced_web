<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" role="img" aria-labelledby="title desc">
  <title id="title">Home wireframe (landmarks + tab order)</title>
  <desc id="desc">Low-fidelity wireframe for Home showing landmarks and tab order annotations.</desc>
  <style>
    .box { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    .soft { fill: #f7f7fb; stroke: #d1d5db; }
    .label { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 18px; fill: #111827; }
    .badge { fill: #0b5fff; stroke: none; }
    .badge-text { fill: #fff; font-size: 14px; font-weight: 700; }
  </style>

  <!-- Header (banner) -->
  <rect class="box" x="40" y="40" width="944" height="80" />
  <text class="label" x="52" y="74">header (role="banner")</text>
  <rect class="badge" x="920" y="50" width="50" height="24" rx="4" />
  <text class="badge-text" x="945" y="67" text-anchor="middle">1</text>
  <text class="label" x="52" y="100">Tab 1: Skip link (hidden until focus) → main</text>

  <!-- Nav -->
  <rect class="soft" x="40" y="120" width="944" height="56" />
  <text class="label" x="52" y="154">nav (Primary)</text>
  <rect class="badge" x="920" y="126" width="50" height="24" rx="4" />
  <text class="badge-text" x="945" y="143" text-anchor="middle">2</text>
  <text class="label" x="52" y="180">Tab 2..n: Nav links (Home, Data, Form)</text>

  <!-- Main -->
  <rect class="box" x="40" y="196" width="640" height="452" />
  <text class="label" x="52" y="230">main (id="main", tabindex="-1")</text>
  <rect class="badge" x="620" y="206" width="50" height="24" rx="4" />
  <text class="badge-text" x="645" y="223" text-anchor="middle">3</text>
  <text class="label" x="52" y="260">Tab 3..n: Buttons and cards in main content</text>

  <!-- Aside -->
  <rect class="soft" x="700" y="196" width="284" height="452" />
  <text class="label" x="712" y="230">aside (complementary)</text>
  <rect class="badge" x="934" y="206" width="50" height="24" rx="4" />
  <text class="badge-text" x="959" y="223" text-anchor="middle">N</text>
  <text class="label" x="712" y="260">Tab after main content: disclosure summary</text>

  <!-- Footer -->
  <rect class="box" x="40" y="660" width="944" height="68" />
  <text class="label" x="52" y="700">footer (contentinfo)</text>
</svg>